    - {kind: asset, name: stool_west, asset: bar_stool, center: [7.45, 1.55, 0.0], size: [0.42, 0.42, 0.75]}
    - {kind: asset, name: stool_east, asset: bar_stool, center: [9.35, 1.55, 0.0], size: [0.42, 0.42, 0.75]}
