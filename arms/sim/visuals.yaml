      floor: '#cfcac3'
      wall: '#f6f6f6'
      ceiling: '#fbfbfb'
      shelf: '#f3f3f3'
      endcap: '#f3f3f3'
      produce_bin: '#ffffff'
      checkout: '#fafafa'
    fixture_styles: {TABLE-A: table, TABLE-B: table}
    table: {top_color: '#d8c3a2', base_color: '#ffffff', top_thickness_m: 0.04, base_inset_m: 0.1, row_pitch_m: 0.16}
    decor:
    # magenta brand wall behind the wearables endcap (north wall) and behind the counter (south wall)
    - {kind: panel, name: accent_north, center: [5.0, 7.985, 1.5], size: [6.0, 0.02, 3.0], color: '#e20074'}
    - {kind: sign, name: sign_north, center: [5.0, 7.96, 2.45], size: [2.4, 0.03, 0.6], text: T-Mobile, color: '#e20074', text_color: '#ffffff'}
    - {kind: panel, name: accent_south, center: [8.4, 0.015, 1.5], size: [3.2, 0.02, 3.0], color: '#e20074'}
    - {kind: sign, name: sign_south, center: [8.4, 0.04, 2.3], size: [1.8, 0.03, 0.45], yaw: 3.1416, text: T-Mobile, color: '#e20074', text_color: '#ffffff'}
