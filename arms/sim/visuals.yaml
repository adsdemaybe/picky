# Visual-only dressing for the Isaac backend (arms/sim/visuals.py). Nothing here changes the planogram, slots, unit
# positions or the wire: ground truth stays planogram-derived (CLAUDE.md rule 5). The Pillow sketch backend and the
# robot fake ignore models and draw the plain boxes.
#
# assets:   3D models (glTF/GLB) downloaded + converted to USD by `python -m arms.sim.fetch_visuals` into
#           PICKY_SIM_ASSET_DIR (default arms/sim/assets/build/visuals, gitignored). Never committed. Each model is
#           scaled to fit the product's dims_m (uniform scale) and stood up (glTF is Y-up). `yaw_deg` turns the model
#           so its front faces the shopper (the item's -y label face). Products without a model stay labeled boxes.
#           Licenses: all CC-BY 4.0 (Sketchfab uploads via Objaverse 1.0); attribution = name + author + url below.
# products: sku -> asset. `display: stand` puts a phone upright on a display puck, leaned back `tilt_deg`.
# stores:   per-store colors, fixture styles (`table`: wood top on a white base, one layer of display units spaced
#           `row_pitch_m` apart) and decor (panels, signs, props).
schema_version: 1
source_base: https://huggingface.co/datasets/allenai/objaverse/resolve/main/

