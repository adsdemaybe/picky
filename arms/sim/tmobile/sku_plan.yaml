# Picky T-Mobile store: how each wireless SKU is drawn in Isaac (tool input, read by arms/sim/tmobile/build_assets.py
# to build the per-SKU package USDs and by arms/sim/tools/gen_sku_assets.py to write data/sim/sku_assets.yaml).
#   pack:        retail packaging form of the stock unit (built at the products.yaml dims_m, our label on the front):
#                pkg_phone_box / pkg_watch_box / pkg_audio_box (rigid lidded box), pkg_shelf_box (carton),
#                pkg_hang_box (carton + header tab with a euro slot, hangs on a peg), pkg_blister_card (backer card +
#                bubble, euro slot), pkg_flat_sleeve (thin sleeve + euro slot), pkg_card_pack (flat card).
#   shelf: device  the stock unit is the unboxed device (speakers faced out): model + device_m (item frame, m).
#   demo_model:  the downloaded model (models.yaml) drawn for the tethered LIVE DEMO unit of this SKU
#                (data/sim/demo_units.yaml gives the slot, stand and device size).
schema: picky tmobile sku plan v1
