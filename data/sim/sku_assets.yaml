# Picky: every SKU -> how one shelf unit is rendered in Isaac Sim (generated by
# arms/sim/tools/gen_sku_assets.py; do not hand-edit, change the decision table in the generator).
# See arms/sim/ASSETS.md.
schema: picky sku_assets v1
generated_from:
  products: data/products.yaml (216 SKUs)
  index: picky-assets/products/index.yaml (463 assets)
  planograms: data/planograms/store_ave.yaml, store_hill.yaml, store_tmobile.yaml
asset_root:
  env: PICKY_ASSET_ROOT
  default: /data/advaiv2/picky-assets/products
  paths: usd / parts[].usd are relative to the asset root
conventions: 'Z-up, meters, kg. Item frame = scene_spec.py''s unit frame (x width, y depth, -y faces the aisle, z up); world
  yaw = scene_spec.item_yaw_for(slot) + facing.yaw_offset_deg. Asset origin = bottom center, so the unit translate is PrimSpec.center
  - (0, 0, target_dims_m[2]/2). render=asset: reference <usd> once per unit, xformOps translate . rotateZ . scale(scale_xyz);
  scale_xyz is in the asset''s NATIVE axes (with yaw_offset 90 the native x maps to item y). target_dims_m is the rendered
  bbox in the item frame: use it as SlotLayout.dims / item_dims so spacing, scan bboxes and basket stacking match the mesh.
  render=parts: unit root gets RigidBodyAPI + MassAPI itself; each part references geom.usda (instanceable) with its own rotate/scale
  at offsets_m (bottom-center, item frame); box wrappers are UsdGeom.Cube. render=primitive: the existing _define_unit path
  with primitive.{shape,dims_m,color} + label.'
gripper:
  model: SO-101 parallel jaw
  usable_open_m: 0.075
  max_open_m: 0.08
  top_grasp_clearance_m: 0.1
  bag_pinch_clearance_m: 0.06
  payload_advisory_kg: 0.5
  note: 'advisory only: the sim pick is a scripted magic grasp; jaw/payload numbers are planning values, not measured'
match_levels:
  exact: right kind of object, rescaled to the SKU
  close: same packaging form, different product (our label covers the front)
  proxy: different form standing in
  gap: no usable model; a stand-in asset under our label
  composite: no single model; built from several real models (+ film/tray/carrier boxes)
  primitive: parametric box/cylinder + label is the realistic look (cartons, flat packs)
