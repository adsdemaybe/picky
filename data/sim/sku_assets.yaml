    - 0.8993
    - 1.5068
    distortion: 1.931
    face_distortion: 1.152
    facing:
      front: -Y (item frame) -> aisle
      yaw_offset_deg: 0
      front_face_native: -Y
      upright: true
      pose_check: index front_checked
    target_dims_m:
    - 0.2
    - 0.05
    - 0.22
    dims_source: products.yaml
    mass_kg: 0.9
    label:
      mode: panel
      face: front
      cover_wh:
      - 0.92
      - 0.86
      center_z: 0.5
      surface: auto (front heightfield) + 0.0015
      sleeve: back + both sides in solid label_color (hides source art)
      area_m:
      - 0.184
      - 0.1892
      png_px:
      - 373
      - 384
      texture: arms.sim.labels.label_png(name, brand, size, price_cents, barcode, color=label_color, px=png_px)
      target: unit
    grasp_form: bag
    grasp:
      mode: top_pinch
