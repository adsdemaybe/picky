# Picky demo data (DubHacks 2026). Sim hints for the T-Mobile store's LIVE DEMO units (no contracts model;
# read by arms/sim when it builds the interactive store, ignored by everything else).
# - demo_m = the DEVICE size from the maker / T-Mobile spec sheet (item frame: x width, y thickness, z height;
#   screen on the -y face, facing the aisle). products.yaml asset.dims_m stays the RETAIL BOX, which is what
#   BACK-STOCK holds and what the robot puts in the basket.
# - Each demo unit is its own rigid prim, kinematic until grabbed (as in the supermarket teleop app), tied to
#   its stand by a D6 / distance joint (tether_length_m) like a real recoiler tether; stand = the alarmed puck.
# - Hook items (ACC-WALL): one prim per facing on a peg; peg hole at the top center of the -y face.
# - shown: open = a foldable / flip displayed unfolded (demo_m is the OPEN size; its box holds it folded).
