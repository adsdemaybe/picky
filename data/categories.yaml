# Picky demo data (DubHacks 2026). Schema: contracts/planogram.py. Validate: uv run python -m utils.data
# Category taxonomy (contracts.planogram.CategoriesFile): top-level ids = Product.category
# (contracts.catalog.STANDARD_CATEGORY_IDS), children = Product.subcategory. Max depth 2. `sort` orders the
# web app's category list (store walk order). Where a category sits in each store is NOT stored here: it is
# derived from the planogram aisles (Aisle.categories) and served as CategoryInfo.aisle_labels:
#   store_ave : produce=Produce tables; household/personal_care/beverages/alcohol=Aisle 1;
#               snacks + breakfast pantry=Aisle 2; international + Mexican + canned=Aisle 3;
#               pasta/baking pantry + bakery=Aisle 4; chips/soda/juice + frozen=Aisle 5;
#               meat/deli/dairy=Back wall; deals on the front endcaps.
#   store_hill: produce=Produce table; pantry/international/Mexican=Aisle 1; snacks/breakfast=Aisle 2;
#               household/personal_care/beverages + meat/deli/dairy wall=Aisle 3.
schema_version: 1
