# Picky demo data (DubHacks 2026). Schema: contracts/planogram.py. Validate: uv run python -m utils.data
# T-Mobile wireless store (T-Mobile track: Cart Whisperer), 10 m x 8 m, laid out like a real T-Mobile store. Product
# names / brands / prices are REAL (public t-mobile.com snapshot, Sat 2026-10-17; see data/products.yaml). This floor
# plan is a demo layout, not any real store's. Trademarks belong to their owners; no affiliation or sponsorship.
#
# y=8 +--------------------------------------------------------------------------------+
#     |   [ WEAR-CASE: tethered watches ]    staff   [ BACK-STOCK: boxed phones/tabs/watches ]
#     |                                      door     staff aisle (robot reaches it round the
#     | A      [HOME-INET pedestal]                  [ COUNTER (Fast Lane) ]  counter's left end)
#     | C                                                checkout pose (8.4, 5.05)        A
#     | C   [TABLE-A]      [TABLE-B]          [TABLE-C]                                    U
#     | |   Apple          Google/Moto/REVVL  Samsung      (live demo units, both long sides) D
#     | W                                                                                 I
#     |                                                                                   O
#     |  ENTRANCE (1.2, 0.6)   Tess dock (2.4, 1.0)
# y=0 +--------------------------------------------------------------------------------+ x=10
#
# - Real-store pattern: every phone, tablet and watch on the floor is a LIVE DEMO UNIT on an alarmed stand / tether
#   (slots on TABLE-A/B/C and WEAR-CASE: qty 1, capacity 1, low_threshold 0). Sales come from the boxed units on
#   BACK-STOCK behind the counter, whose slots are listed FIRST: the catalog's get_locations() keeps file order and
#   the brain / orchestrator pick the first stocked location, so the robot fetches a box, never the demo unit.
#   Exception: IPDUO-256 is pre-order only (back stock 0), so today its only stocked location is the demo unit.
# - ACC-WALL is a slatwall with 5 hook rows (boards in contracts terms): device bays iPhone / Pixel / Galaxy with
#   cases + glass on hooks 4-2 (newest at eye level), chargers / cables / power / car / grips on hooks 1-0.
#   AUDIO-WALL = boxed audio on 4 shelves by brand. HOME-INET = Home Internet gateway, hotspots, 5G antenna.
#   COUNTER = checkout: AirTag + PopGrip on the customer side, SIM kits on the staff side.
# - Fixture kinds (contracts.planogram.FixtureKind has no display_table / slatwall / counter): tables use
#   produce_bin (open-top table body picked from both long sides), the pedestal + watch case use endcap, the counter
#   uses checkout. Tether / hook geometry for the interactive Isaac scene: data/sim/demo_units.yaml.
# - Geometry rules as the grocery stores (data/README.md): item_position on the pick-face edge at level_z_m,
#   approach_pose 0.375 m out facing the item, >= 0.3 m clearance; slot ids TMO-<fixture>-<face><level>-<index>.
# - Demo hooks: CASE-IP18P-CLR out of stock (launch sell-out -> swap to the ZAGG / Pelican case or order online),
#   GLASS-IP18P-XTR6 low (2/10), IPDUO-256 low (pre-order: demo unit only); CHG-20W shelf tag still shows the old
#   $24.99 (system $14.99: mispricing row); deals: GLASS-PX9 20% off, CASE-PX7-BLK clearance $9.99, WATCH-PX3
#   clearance $399.99.
