# Entrance bottom-left, checkout bottom-right, produce tables up front, 5 aisles (1.6 m), meat/deli/dairy
# wall at the back. Slot ids are store-prefixed (AVE-<fixture>-<face><level>-<index>). Approach poses sit
# 0.375 m off the shelf face (SO-101 rover, contracts.common). Docks: data/fixtures/robots.yaml.
# Demo hooks: CILANTRO qty 0 (online split), BEANS-REFRIED shelf tag 249 vs 199 (mispricing),
# GUAC-KIT / YOGURT-GREEK / BREAD-SOURDOUGH near-expiry markdowns, deals on the two front endcaps,
# aisle 2 snacks: PRETZELS out, CRACKERS + COOKIES-CHOC-CHIP low (staff shelf_scan / stock alerts demo).
