# --------------------------------------------------------------------------------------------------- Household Mix
# Households for the optimizer. account_ids pull lines from data/wireless.yaml; `separate` households are people
# paying on different accounts today. age_55 marks lines eligible for 55+ plans. streaming_cents = streaming services
# the household pays for on its own (a plan perk can cover them).
households:
- id: garcia
  name: 'Garcia family'
  account_ids: [acct_garcia]
  streaming: [{name: 'Streaming service A', monthly_cents: 1799}, {name: 'Streaming service B', monthly_cents: 999}]
  note: 'Paying for Premium, but every line uses under 25 GB.'
- id: nguyen
  name: 'Nguyen household (three separate accounts)'
  separate: true
  streaming: [{name: 'Streaming service A', monthly_cents: 1799}]
  note: 'Three adults in one apartment, each paying on their own.'
  lines:
  - {line_id: ng-1, label: Linh, device_name: iPhone 15, current_plan_id: plus_unlimited, current_monthly_cents: 7000, usage_gb_month: 30, hotspot_gb_month: 4}
  - {line_id: ng-2, label: Bao, device_name: Galaxy S24, current_plan_id: value_unlimited, current_monthly_cents: 5500, usage_gb_month: 14, hotspot_gb_month: 1}
  - {line_id: ng-3, label: Mai, device_name: Pixel 8, current_plan_id: prepaid_10gb, current_monthly_cents: 4000, usage_gb_month: 9, hotspot_gb_month: 0}
- id: alex
  name: 'Alex & Robin (switching)'
  account_ids: [acct_alex]
  streaming: [{name: 'Streaming service A', monthly_cents: 1799}]
  note: 'Paying $135 a month at another carrier.'
- id: ruth
  name: 'Ruth'
  account_ids: [acct_ruth]
  age_55_lines: [ruth-1]
  streaming: []
  note: 'One light-use line, eligible for 55+.'
- id: dev
  name: 'Dev'
  account_ids: [acct_dev]
  streaming: []
  note: '140 GB a month and 45 GB of hotspot on a plan with no priority data.'
