[project]
name = "picky"
version = "0.1.0"
description = "Picky: AI shopping-assistant robot for physical stores (DubHacks 2026)"
readme = "README.md"
requires-python = ">=3.11"
# Base deps only. Fakes, contracts and utils must run with these alone.
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "anthropic>=0.60",
  "pillow>=10.4",  # synthetic camera frames (robot fake) + JPEG snapshots/MJPEG (cameras API)
]

[project.optional-dependencies]
# Heavy, arm-specific deps: `uv sync --extra <arm>` (or `--all-extras`). Add yours here in your arm PR.
catalog = ["psycopg[binary]>=3.2", "sqlalchemy[asyncio]>=2.0", "pgvector>=0.3", "duckdb>=1.0"]  # asyncio = greenlet (SQLAlchemy 2.1 no longer pulls it in)
perception = [
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4",
  "zxing-cpp>=2.2",
  "open-clip-torch>=2.31",
  "torch",
  "timm>=1.0.15",
  # Perceptron Mk1.5 = THE verifier vision provider (arms/perception/vision/perceptron.py; lazy import). 0.4.0 pins
  # Pillow<12, so the lock resolves Pillow 11.x for everyone (no Pillow 12+ API is used anywhere).
  "perceptron>=0.4,<0.5",
]
# Isaac itself (isaacsim[all,extscache]==6.2.0.0, torch cu128) is installed by hand on the GPU host; see arms/sim/README.md.
sim = ["opencv-python-headless>=4.10,<5", "pillow>=10.4"]
# mujoco = the local no-GPU physics + render backend (`python -m arms.sim.app --backend mujoco`, arms/sim/mujoco_backend.py).
mujoco = ["mujoco>=3.3", "pillow>=10.4"]
routing = ["ortools>=9.10", "scipy>=1.13", "scikit-image>=0.24"]
# agent: google-genai = the default LLM provider for utils.llm (Gemini); deepgram = voice.
agent = ["deepgram-sdk>=7.13", "google-genai>=2.31,<3"]
recommender = ["sentence-transformers>=6.1", "pgvector>=0.5.1"]
trust = ["stripe>=10.0"]
messaging = ["photonhq-api==0.5.0"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.24"]
e2e = [
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "utils", "arms"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["arms/frontend", "arms/messaging/photon"]

[tool.ruff.format]
# docs/*.md hold compact, illustrative code blocks (design sketches), not runnable code.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["contracts", "utils", "arms"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
