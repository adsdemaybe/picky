[project]
name = "picky"
version = "0.1.0"
description = "Picky: AI shopping-assistant robot for physical stores (DubHacks 2026)"
readme = "README.md"
requires-python = ">=3.11"
# Base deps only. Fakes, contracts and utils must run with these alone.
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "anthropic>=0.60",
]

[project.optional-dependencies]
# Heavy, arm-specific deps: `uv sync --extra <arm>` (or `--all-extras`). Add yours here in your arm PR.
catalog = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0", "pgvector>=0.3", "duckdb>=1.0"]
perception = [
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4",
  "zxing-cpp>=2.2",
  "open-clip-torch>=2.31",
  "torch",
  "timm>=1.0.15",
]
# Isaac itself (isaacsim[all,extscache]==6.2.0.0, torch cu128) is installed by hand on the GPU host; see arms/sim/README.md.
sim = ["opencv-python-headless>=4.10,<5", "pillow>=10.4"]
routing = ["ortools>=9.10", "scipy>=1.13", "scikit-image>=0.24"]
agent = ["deepgram-sdk>=7.13"]
recommender = ["sentence-transformers>=6.1", "pgvector>=0.5.1"]
trust = ["stripe>=10.0"]
messaging = ["photonhq-api==0.5.0"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "utils", "arms"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["arms/frontend", "arms/messaging/photon"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["contracts", "utils", "arms"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
